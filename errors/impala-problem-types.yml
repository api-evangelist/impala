    media_type: application/json
  - status: 403
    title: Forbidden
    detail: Not authorized to use this service. Contact support@impala.travel to gain access.
    media_type: application/json
  - status: 404
    title: Not found
    detail: The requested resource does not exist.
    media_type: application/json
  - status: 500
    title: Internal server error
    detail: >-
      Internal error within the Impala platform. Contact support@impala.travel with the
      x-correlation-id response header value for diagnosis.
