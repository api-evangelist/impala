note: >-
  Impala did not use RFC 9457 problem+json; errors are returned as the
  genericError object (code + message) with application/json. A Warning response
  header signals that a 2xx response was only partially processed. The
  x-correlation-id response header should be quoted to support@impala.travel when
  reporting 500s.
