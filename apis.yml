name: Impala
description: >-
  Impala built a single, standardized REST API for the hotel industry — one
  integration to search availability, read rate plans, and create, amend, and
  cancel bookings across many property management systems (PMS), so any app could
  sell hotel rooms and earn commission per booking. Founded in London in 2016 and
  backed by Speedinvest, Lakestar, and Kima Ventures, Impala shipped a sandbox
  (with a demo hotel, "The Charleston"), a Postman collection, and PHP/JavaScript
  wrappers. The company is now defunct: getimpala.com / impala.travel and the API
  and docs hosts no longer resolve, and the primary domain is held by an unrelated
  party. This profile preserves the historical OpenAPI (apis.guru
  impala.travel:hotels 1.003) and pipeline-derived artifacts for the record.
