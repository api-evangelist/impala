          example: breakfast
          type: string
        includedInRate:
          type: boolean
        type:
          description: The type of product or service included in the price. We currently support rates including "BREAKFAST", "LUNCH", "DINNER" and "ALL_INCLUSIVE".
          enum:
          - BREAKFAST
          - LUNCH
          - DINNER
          - WELCOME_BEVERAGE
